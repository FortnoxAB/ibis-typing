# prek -- pre-commit configuration
[[repos]]
# Linting and formatting
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.16"
hooks = [
    { id = "ruff-check", args = ["--fix"], types_or = ["python", "pyi"] },
    { id = "ruff-format", types_or = ["python", "pyi"] },
]

[[repos]]
# Type checking
repo = "local"
hooks = [
    { id = "pyrefly", name = "pyrefly", entry = "uv run pyrefly check", language = "system", types_or = ["python", "pyi"], pass_filenames = false },
]
